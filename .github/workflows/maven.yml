name: CI - Maven build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo
        ports:
          - 5432:5432

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/demo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Duplicate code check
        run: mvn -B pmd:cpd-check

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate the UML diagram
        run: |
          export MAVEN_OPTS="--add-exports java.desktop/com.sun.imageio.plugins.png=ALL-UNNAMED"
          mvn -B plantuml:generate    

      - name: Download UML Diagrams
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-diagrams
          path: target/plantuml/
          if-no-files-found: warn

      - name: Generate PMD Report
        run: mvn -B pmd:pmp pmd:check

      - name: Upload PMD Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: target/site/

      - name: Build
        run: mvn -B -DskipTests verify