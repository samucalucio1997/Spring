server:
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Authserver (Keycloak): a API atua apenas como resource server e valida o JWT
  # buscando as chaves publicas em <issuer-uri>/protocol/openid-connect/certs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ecommerce}

  kafka:
    producer:
#      acks: all
#      retries: 50
#      properties:
#        retry:
#          backoff:
#            ms: 1000
#        schema:
#          registry:
#            url: http://localhost:8081
#            ssl:
#              keystore:
#                location: classpath:keystore.jks
#                password: keystorepassword
#                type: JKS
#              key:
#                password: keypassword
#              truststore:
#                location: classpath:truststore.jks
#                password: truststorepassword
#                type: JKS
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    bootstrap-servers: kafka:9092
    template:
      default-topic: PAYMENT.PIX

  #        dialect: org.hibernate.dialect.MySQL57Dialect
#  flyway:
#    enabled: false
#    locations: classpath:db/migration
chave:

AWS_REGION: us-east-2

# client-id usado para ler as roles de resource_access.<client-id>.roles no token
keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:angular-frontend}

bucket-aws:
    nome: bucket-imagens-estoque-gerencia

chave-upload:
  aws:
    access-key:
    secret-key:

endpoints:
  configprops:
    enabled: true
  beans:
    enabled: true
  shutdown:
    enabled: true

management:
  endpoints:
    enabled-by-default: true
    sensitive: false
    enabled: true
    configprops:
      enabled: true
    beans:
      enabled: true
    shutdown:
      enabled: true
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.web.cors: DEBUG

